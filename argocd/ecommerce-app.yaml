apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Vignesh-Kds/ArgoCD.git
    targetRevision: main
    path: charts/ecommerce

    helm:
      releaseName: ecommerce

  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
